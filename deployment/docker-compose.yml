services:
  # ── Ollama inference server ────────────────────────────────────────────────
  # Model must already exist in the persistent ollama_data volume.
  # Bootstrap verifies the exact local OLLAMA_MODEL name before starting the app.
  #
  # For local GGUF deployment (e.g. trained recovery model), use the
  # llama-server service below instead of this one.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/root/.ollama/models
    volumes:
      - ollama_data:/root/.ollama
    command: serve
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '3.0'
    networks:
      - internal_net
    restart: unless-stopped
    profiles:
      - ollama

  # ── llama.cpp server for local GGUF ───────────────────────────────────────
  # Use this instead of ollama when deploying a local GGUF file.
  # Set LLM_MODEL to the model file name in /models
  llama-server:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggerganov/llama.cpp:server}
    container_name: llama_server
    command:
      - --model
      - /models/${LLM_MODEL:-Qwen3.5-4B.Clean-Recovery.Q4_K_M.gguf}
      - --mmproj
      - /models/${LLAMA_MMPROJ_FILENAME:-Qwen3.5-4B.BF16-mmproj.gguf}
      - --alias
      - ${LLM_MODEL_NAME:-qwen3.5-private-analyst}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${LLAMA_CTX_SIZE:-8192}
      - --n-gpu-layers
      - ${LLAMA_N_GPU_LAYERS:-32}
      - --threads
      - ${LLAMA_THREADS:-4}
    volumes:
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '3.0'
    networks:
      - internal_net
    restart: unless-stopped
    profiles:
      - localgguf

  # ── ChromaDB vector store ──────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: chroma_server
    environment:
      - CHROMA_SERVER_AUTH_CREDENTIALS=${CHROMA_AUTH_TOKEN:-change-me}
      - CHROMA_SERVER_AUTH_PROVIDER=chromadb.auth.token.TokenAuthServerProvider
    volumes:
      - ./chroma_data:/chroma/chroma
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '0.5'
    networks:
      - internal_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI RAG app ────────────────────────────────────────────────────────
  app:
    build: ./app
    container_name: custom_app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      # Use llama-server (localgguf profile) or ollama (ollama profile)
      - LLAMA_API_URL=${LLAMA_API_URL:-http://llama-server:8080/v1}
      - CHROMA_API_URL=http://chromadb:8000
      - CHROMA_AUTH_TOKEN=${CHROMA_AUTH_TOKEN:-change-me}
      - EVALUATION_API_TOKEN=${EVALUATION_API_TOKEN:-}
      - EVALUATION_ATTESTATION_KEY=${EVALUATION_ATTESTATION_KEY:-}
      - EVALUATION_MODEL_PATH=/models/${LLM_MODEL:-Qwen3.5-4B.Clean-Recovery.Q4_K_M.gguf}
      - EVALUATION_MMPROJ_PATH=/models/${LLAMA_MMPROJ_FILENAME:-Qwen3.5-4B.BF16-mmproj.gguf}
      - EVALUATION_INDEX_PATH=/data/ocr_pipeline/chroma_chunks.jsonl
      - EVALUATION_CHECKSUMS_PATH=/models/SHA256SUMS
      - INGESTION_LOCK_PATH=/run/private-analyst-locks/ingest.lock
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME:-research_chunks_v1}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - LLAMA_CPP_IMAGE=${LLAMA_CPP_IMAGE:-ghcr.io/ggerganov/llama.cpp:server}
      - LLAMA_CTX_SIZE=${LLAMA_CTX_SIZE:-8192}
      - LLAMA_N_GPU_LAYERS=${LLAMA_N_GPU_LAYERS:-32}
      - LLAMA_THREADS=${LLAMA_THREADS:-4}
      # The Ollama model name — used only when LLAMA_API_URL points to Ollama
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-qwen3.5-private-analyst}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-4}
      - MAX_CONTEXT_CHARS=${MAX_CONTEXT_CHARS:-12000}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-900}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-120}
    volumes:
      - ../ocr_pipeline:/data/ocr_pipeline:ro
      - ./models:/models:ro
      - ./model_cache:/root/.cache
      - ingestion_locks:/run/private-analyst-locks:ro
    depends_on:
      chromadb:
        condition: service_healthy
      # ollama:  # active only with "ollama" profile
      # llama-server:  # active only with "localgguf" profile
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '2.5'
    networks:
      - internal_net
    restart: unless-stopped

  # ── One-shot ChromaDB ingestion ───────────────────────────────────────────
  ingest:
    build: ./app
    profiles:
      - ingest
    command: python ingest.py --input-path /data/ocr_pipeline/chroma_chunks.jsonl --batch-size 256
    environment:
      - CHROMA_API_URL=http://chromadb:8000
      - CHROMA_AUTH_TOKEN=${CHROMA_AUTH_TOKEN:-change-me}
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME:-research_chunks_v1}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - INGESTION_LOCK_PATH=/run/private-analyst-locks/ingest.lock
    volumes:
      - ../ocr_pipeline:/data/ocr_pipeline:ro
      - ./model_cache:/root/.cache
      - ingestion_locks:/run/private-analyst-locks
    depends_on:
      - chromadb
    networks:
      - internal_net

  # ── Optional TLS reverse proxy ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    profiles:
      - proxy
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - internal_net
    depends_on:
      - app
    restart: unless-stopped

networks:
  internal_net:
    driver: bridge

volumes:
  ollama_data:
  ingestion_locks:
